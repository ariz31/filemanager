    [data-theme="dark"] { color-scheme: dark; --bg:#0b1220; --panel:#111827; --panel-soft:#172033; --text:#e5e7eb; --muted:#94a3b8; --border:#263247; --primary:#60a5fa; --primary-strong:#3b82f6; --danger:#f87171; --success:#4ade80; --shadow:0 14px 34px rgba(0,0,0,.32); }
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top left,rgba(37,99,235,.10),transparent 36rem),var(--bg);color:var(--text);min-height:100vh} button,input,textarea,select{font:inherit} button{border:0;border-radius:12px;background:var(--panel-soft);color:var(--text);cursor:pointer;padding:.72rem .9rem;transition:transform .12s ease,background .12s ease,opacity .12s ease} button:hover:not(:disabled){transform:translateY(-1px)} button:disabled{opacity:.42;cursor:not-allowed}.primary{background:var(--primary);color:#fff}.primary:hover:not(:disabled){background:var(--primary-strong)}.danger{background:rgba(220,38,38,.12);color:var(--danger)}.ghost{background:transparent;border:1px solid var(--border)}.app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh} aside{border-right:1px solid var(--border);background:rgba(255,255,255,.74);backdrop-filter:blur(20px);padding:1.15rem;position:sticky;top:0;height:100vh;overflow:auto}[data-theme="dark"] aside{background:rgba(17,24,39,.76)}.brand{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}.brand-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,var(--primary),#9333ea);color:#fff;font-size:1.35rem;box-shadow:var(--shadow)}.brand h1{font-size:1.05rem;margin:0}.brand p{margin:.1rem 0 0;color:var(--muted);font-size:.84rem}.sidebar-section{margin-top:1.2rem}.sidebar-title{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 .45rem}.quick-actions{display:grid;gap:.5rem}.quick-actions button,.tree-button{width:100%;text-align:left;display:flex;align-items:center;gap:.62rem;justify-content:flex-start}.tree{display:grid;gap:.25rem}.tree-button{padding:.55rem .65rem;background:transparent;border:1px solid transparent}.tree-button.active{background:rgba(37,99,235,.12);border-color:rgba(37,99,235,.22);color:var(--primary)}.tree-button span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stats{display:grid;gap:.5rem}.stat-card{border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:.75rem}.stat-card strong{display:block;font-size:1.1rem}.stat-card small{color:var(--muted)} main{min-width:0}.topbar{min-height:var(--toolbar);display:grid;grid-template-columns:1fr auto;gap:.9rem;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid var(--border);background:rgba(246,248,251,.76);backdrop-filter:blur(20px);position:sticky;top:0;z-index:5}[data-theme="dark"] .topbar{background:rgba(11,18,32,.76)}.searchbox{position:relative}.searchbox input{width:100%;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:16px;padding:.85rem 1rem .85rem 2.55rem;outline:none}.searchbox input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.16)}.searchbox::before{content:"🔎";position:absolute;left:.9rem;top:.8rem}.toolbar{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}.content{padding:1.25rem;display:grid;gap:1rem}.breadcrumb{display:flex;align-items:center;gap:.4rem;color:var(--muted);flex-wrap:wrap}.breadcrumb button{padding:.38rem .55rem;border-radius:10px;background:transparent;color:var(--primary)}.status-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.status-row p{margin:0;color:var(--muted)}.bulkbar{display:none;align-items:center;justify-content:space-between;gap:.7rem;border:1px solid var(--border);background:var(--panel);border-radius:var(--radius);padding:.7rem .85rem;box-shadow:var(--shadow)}.bulkbar.visible{display:flex}.filters{display:flex;gap:.45rem;flex-wrap:wrap}.chip{border:1px solid var(--border);background:var(--panel);padding:.46rem .68rem;border-radius:999px;color:var(--muted)}.chip.active{color:#fff;background:var(--primary);border-color:var(--primary)}.files.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:.9rem}.files.list{display:grid;gap:.55rem}.file-card{border:1px solid var(--border);background:var(--panel);border-radius:var(--radius);padding:.85rem;box-shadow:0 8px 20px rgba(15,23,42,.04);min-width:0;position:relative;outline:none}.file-card:focus,.file-card.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.14)}.files.grid .file-card{min-height:150px;display:grid;gap:.6rem;align-content:start}.files.list .file-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.8rem}.file-check{position:absolute;top:.65rem;right:.65rem;width:18px;height:18px}.file-icon{font-size:2rem;width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:var(--panel-soft)}.file-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-meta{color:var(--muted);font-size:.8rem;display:flex;gap:.45rem;flex-wrap:wrap}.card-actions{display:flex;gap:.3rem;flex-wrap:wrap}.card-actions button{padding:.4rem .5rem;border-radius:10px}.empty{border:1px dashed var(--border);background:var(--panel);border-radius:var(--radius);min-height:310px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:2rem}.dropzone{border:2px dashed transparent;border-radius:var(--radius);min-height:calc(100vh - var(--toolbar) - 2.5rem)}.dropzone.dragover{border-color:var(--primary);background:rgba(37,99,235,.08)}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.56);display:none;align-items:center;justify-content:center;z-index:50;padding:1rem}.modal-backdrop.visible{display:flex}.modal{width:min(920px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}.modal header,.modal footer{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.1rem;border-bottom:1px solid var(--border)}.modal footer{border-top:1px solid var(--border);border-bottom:0;justify-content:flex-end}.modal h2{margin:0;font-size:1.05rem}.modal-body{p   </style>
</head>
<body>
  <div class="app" id="app">
    <aside aria-label="File manager navigation"><div class="brand"><div class="brand-icon" aria-hidden="true">📁</div><div><h1>File Manager Pro</h1><p>Local-first browser workspace</p></div></div><div class="quick-actions"><button class="primary" id="newFolderBtn">＋ New folder</button><button id="newFileBtn">📝 New text file</button><button id="uploadBtn">⬆ Upload files</button><button id="uploadFolderBtn">🗂 Upload folder</button><button id="backupBtn">💾 Export backup</button><button id="restoreBtn">♻ Import backup</button></div><div class="sidebar-section"><p class="sidebar-title">Locations</p><div class="tree"><button class="tree-button active" id="homeBtn"><span>🏠</span><span>Home</span></button><button class="tree-button" id="favoriteBtn"><span>⭐</span><span>Favorites</span></button><button class="tree-button" id="trashBtn"><span>🗑</span><span>Trash</span></button></div></div><div class="sidebar-section"><p class="sidebar-title">Folders</p><div class="tree" id="folderTree"></div></div><div class="sidebar-section"><p class="sidebar-title">Storage</p><div class="stats" id="stats"></div></div></aside>
    <main><div class="topbar"><div class="searchbox"><label class="sr-only" for="searchInput">Search files</label><input id="searchInput" autocomplete="off" placeholder="Search by name, type, extension, or tags…" /></div><div class="toolbar"><select id="sortSelect" aria-label="Sort files"><option value="name">Name</option><option value="updatedAt">Recently updated</option><option value="createdAt">Date created</option><option value="size">Size</option><option value="type">Type</option></select><button id="viewToggleBtn" title="Toggle grid/list view">▦ Grid</button><button id="themeBtn" title="Toggle light/dark mode">🌙</button></div></div><section class="content dropzone" id="dropzone"><nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav><div class="status-row"><p id="statusText">Ready</p><div class="filters" id="filters"></div></div><div class="bulkbar" id="bulkbar"><strong id="bulkText">0 selected</strong><div class="toolbar"><button id="selectAllBtn">Select all</button><button id="moveBtn">Move</button><button id="downloadBtn">Download</button><button id="tagBtn">Tags</button><button class="danger" id="deleteBtn">Delete</button><button id="clearSelectionBtn">Clear</button></div></div><div class="files grid" id="files" aria-live="polite"></div></section></main>
  </div>
  <input class="sr-only" id="fileInput" type="file" multiple /><input class="sr-only" id="folderInput" type="file" multiple webkitdirectory directory /><input class="sr-only" id="restoreInput" type="file" accept="application/json,.json" />
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><header><h2 id="modalTitle">Dialog</h2><button id="modalCloseBtn" aria-label="Close dialog">✕</button></header><div class="modal-body" id="modalBody"></div><footer id="modalFooter"></footer></div></div><div class="toast-wrap" id="toasts" aria-live="assertive"></div>
  <script id="app-script">
  (() => {
    'use strict';
    const DB_NAME='filemanager-pro-db',STORE='items',ROOT_ID='root',VERSION=1,MAX_TEXT_PREVIEW_BYTES=1024*1024;
    const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
    const state={db:null,items:[],currentFolderId:ROOT_ID,selected:new Set(),view:localStorage.getItem('fm:view')||'grid',theme:localStorage.getItem('fm:theme')||'light',search:'',filter:'all',sort:localStorage.getItem('fm:sort')||'name',special:'home'};
    const els={app:$('#app'),files:$('#files'),breadcrumb:$('#breadcrumb'),statusText:$('#statusText'),folderTree:$('#folderTree'),stats:$('#stats'),filters:$('#filters'),searchInput:$('#searchInput'),sortSelect:$('#sortSelect'),viewToggleBtn:$('#viewToggleBtn'),themeBtn:$('#themeBtn'),bulkbar:$('#bulkbar'),bulkText:$('#bulkText'),dropzone:$('#dropzone'),fileInput:$('#fileInput'),folderInput:$('#folderInput'),restoreInput:$('#restoreInput'),modalBackdrop:$('#modalBackdrop'),modalTitle:$('#modalTitle'),modalBody:$('#modalBody'),modalFooter:$('#modalFooter'),toasts:$('#toasts')};
    function uid(p='id'){return `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,9)}`}
    function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function formatBytes(b=0){if(!b)return'0 B';const u=['B','KB','MB','GB'],i=Math.min(Math.floor(Math.log(b)/Math.log(1024)),u.length-1);return `${(b/Math.pow(1024,i)).toFixed(i?1:0)} ${u[i]}`}
    function formatDate(v){return new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}
    function getExtension(n=''){const p=n.split('.');return p.length>1?p.pop().toLowerCase():''}
    function isTextLike(i){const m=i.mime||'',e=getExtension(i.name);return m.startsWith('text/')||['txt','md','csv','json','js','ts','html','css','py','xml','yaml','yml','log'].includes(e)}
    function iconFor(i){if(i.type==='folder')return i.deletedAt?'🗑️':'📁';const m=i.mime||'',e=getExtension(i.name);if(m.startsWith('image/'))return'🖼️';if(m.startsWith('video/'))return'🎬';if(m.startsWith('audio/'))return'🎵';if(m.includes('pdf'))return'📕';if(m.includes('zip')||['zip','rar','7z'].includes(e))return'🗜️';if(m.includes('spreadsheet')||['csv','xls','xlsx'].includes(e))return'📊';if(m.includes('presentation')||['ppt','pptx'].includes(e))return'📽️';if(m.includes('word')||['doc','docx'].includes(e))return'📄';if(isTextLike(i))return'📝';return'📦'}
    function toast(msg,type='info'){const n=document.createElement('div');n.className=`toast ${type}`;n.textContent=msg;els.toasts.appendChild(n);setTimeout(()=>n.remove(),4200)}
    function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,VERSION);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE)){const s=db.createObjectStore(STORE,{keyPath:'id'});s.createIndex('parentId','parentId',{unique:false});s.createIndex('type','type',{unique:false});s.createIndex('deletedAt','deletedAt',{unique:false})}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
    function tx(m='readonly'){return state.db.transaction(STORE,m).objectStore(STORE)}
    function getAllItems(){return new Promise((res,rej)=>{const r=tx().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
    function saveItem(item){return new Promise((res,rej)=>{const r=tx('readwrite').put(item);r.onsuccess=()=>res(item);r.onerror=()=>rej(r.error)})}
    function deleteItemHard(id){return new Promise((res,rej)=>{const r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
    async function refresh(){state.items=await getAllItems();render()}
    const activeItems=()=>state.items.filter(i=>!i.deletedAt),findItem=id=>state.items.find(i=>i.id===id),childrenOf=(p,d=false)=>state.items.filter(i=>i.parentId===p&&(d||!i.deletedAt));
    function descendantsOf(folderId,includeDeleted=true){const out=[],stack=[folderId];while(stack.length){const p=stack.pop();state.items.forEach(i=>{if(i.parentId===p&&(includeDeleted||!i.deletedAt)){out.push(i);if(i.type==='folder')stack.push(i.id)}})}return out}
    function uniqueName(name,parentId,idToIgnore=null){const cleaned=String(name||'').trim().replace(/[\\/]+/g,'-').slice(0,180)||'Untitled',siblings=new Set(childrenOf(parentId,false).filter(i=>i.id!==idToIgnore).map(i=>i.name.toLowerCase()));if(!siblings.has(cleaned.toLowerCase()))return cleaned;const dot=cleaned.lastIndexOf('.'),base=dot>0?cleaned.slice(0,dot):cleaned,ext=dot>0?cleaned.slice(dot):'';let n=2;while(siblings.has(`${base} (${n})${ext}`.toLowerCase()))n++;return `${base} (${n})${ext}`}
    function isFolderAvailable(id){if(id===ROOT_ID)return true;const i=findItem(id);return Boolean(i&&i.type==='folder'&&!i.deletedAt)}
    async function createFolder(name='New Folder',parentId=state.currentFolderId){if(!isFolderAvailable(parentId))parentId=ROOT_ID;const now=new Date().toISOString(),item={id:uid('folder'),type:'folder',name:uniqueName(name,parentId),parentId,size:0,mime:'folder',tags:[],favorite:false,createdAt:now,updatedAt:now,deletedAt:null};await saveItem(item);await refresh();toast(`Created folder “${item.name}”.`,'success');return item}
    async function createTextFile(name='Untitled.txt',content='',parentId=state.currentFolderId){const now=new Date().toISOString(),blob=new Blob([content],{type:'text/plain'}),item={id:uid('file'),type:'file',name:uniqueName(name,parentId),parentId,size:blob.size,mime:'text/plain',blob,textIndex:content.slice(0,MAX_TEXT_PREVIEW_BYTES),tags:[],favorite:false,createdAt:now,updatedAt:now,deletedAt:null};await saveItem(item);await refresh();toast(`Created file “${item.name}”.`,'success');return item}
    async function addFile(file,parentId=state.currentFolderId){const now=new Date().toISOString(),item={id:uid('file'),type:'file',name:uniqueName(file.name||'Uploaded file',parentId),parentId,size:file.size||0,mime:file.type||'application/octet-stream',blob:file,textIndex:'',tags:[],favorite:false,createdAt:now,updatedAt:now,deletedAt:null};if(isTextLike(item)&&file.size<=MAX_TEXT_PREVIEW_BYTES)item.textIndex=await file.text().catch(()=>'');await saveItem(item);return item}
    async function ensurePath(parts,parentId){let current=parentId;for(const part of parts.filter(Boolean)){const existing=childrenOf(current).find(i=>i.type==='folder'&&i.name.toLowerCase()===part.toLowerCase());if(existing){current=existing.id;continue}const folder=await createFolder(part,current);current=folder.id}return current}
    async function uploadFiles(fileList,preserveFolders=false){const files=Array.from(fileList||[]);if(!files.length)return;let count=0;for(const file of files){const rel=preserveFolders?(file.webkitRelativePath||file.name):file.name,parts=rel.split('/').filter(Boolean),fileName=parts.pop()||file.name,parentId=preserveFolders&&parts.length?await ensurePath(parts,state.currentFolderId):state.currentFolderId,patched=fileName===file.name?file:new File([file],fileName,{type:file.type,lastModified:file.lastModified});await addFile(patched,parentId);count++}await refresh();toast(`Uploaded ${count} file${count===1?'':'s'}.`,'success')}
    function getVisibleItems(){let items;if(state.special==='trash')items=state.items.filter(i=>i.deletedAt);else if(state.special==='favorites')items=activeItems().filter(i=>i.favorite);else if(state.search.trim())items=activeItems();else items=childrenOf(state.currentFolderId);const q=state.search.trim().toLowerCase();if(q)items=items.filter(i=>[i.name,i.mime,getExtension(i.name),(i.tags||[]).join(' '),i.textIndex||''].join(' ').toLowerCase().includes(q));if(state.filter!=='all')items=items.filter(i=>state.filter==='folders'?i.type==='folder':state.filter==='images'?i.mime?.startsWith('image/'):state.filter==='documents'?i.type==='file'&&!i.mime?.startsWith('image/')&&!i.mime?.startsWith('video/')&&!i.mime?.startsWith('audio/'):state.filter==='media'?['image/','video/','audio/'].some(p=>i.mime?.startsWith(p)):true);return items.sort((a,b)=>{const k=state.sort;if(k==='size')return(b.size||0)-(a.size||0);if(k==='updatedAt'||k==='createdAt')return new Date(b[k])-new Date(a[k]);if(k==='type')return `${a.type}-${a.mime}-${a.name}`.localeCompare(`${b.type}-${b.mime}-${b.name}`);return a.name.localeCompare(b.name,undefined,{sensitivity:'base',numeric:true})})}
    function folderPath(id){const parts=[];let cur=id;while(cur&&cur!==ROOT_ID){const item=findItem(cur);if(!item)break;parts.unshift(item);cur=item.parentId}return parts}
    function setLocation(kind,folderId=ROOT_ID){state.special=kind;if(folderId)state.currentFolderId=folderId;state.selected.clear();render()}
    function renderBreadcrumb(){if(state.special==='trash'){els.breadcrumb.innerHTML='<span>🗑 Trash</span>';return}if(state.special==='favorites'){els.breadcrumb.innerHTML='<span>⭐ Favorites</span>';return}const parts=folderPath(state.currentFolderId),nodes=[`<button data-folder="${ROOT_ID}">Home</button>`];parts.forEach(p=>nodes.push('<span>/</span>',`<button data-folder="${escapeHtml(p.id)}">${escapeHtml(p.name)}</button>`));els.breadcrumb.innerHTML=nodes.join('');$$('button[data-folder]',els.breadcrumb).forEach(b=>b.addEventListener('click',()=>setLocation('home',b.dataset.folder)))}
    function renderFolderTree(){const folders=activeItems().filter(i=>i.type==='folder').sort((a,b)=>a.name.localeCompare(b.name));if(!folders.length){els.folderTree.innerHTML='<p class="file-meta">No folders yet.</p>';return}els.folderTree.innerHTML=folders.map(f=>{const depth=folderPath(f.id).length-1,active=state.special==='home'&&state.currentFolderId===f.id?'active':'';return `<button class="tree-button ${active}" data-folder="${escapeHtml(f.id)}" style="padding-left:${Math.min(depth*14+10,60)}px"><span>📁</span><span>${escapeHtml(f.name)}</span></button>`}).join('');$$('button[data-folder]',els.folderTree).forEach(b=>b.addEventListener('click',()=>setLocation('home',b.dataset.folder)))}
    function renderFilters(){const filters=[['all','All'],['folders','Folders'],['documents','Documents'],['images','Images'],['media','Media']];els.filters.innerHTML=filters.map(([v,l])=>`<button class="chip ${state.filter===v?'active':''}" data-filter="${v}">${l}</button>`).join('');$$('[data-filter]',els.filters).forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;state.selected.clear();render()}))}
    function renderStats(){const active=activeItems(),files=active.filter(i=>i.type==='file'),folders=active.filter(i=>i.type==='folder'),total=files.reduce((s,i)=>s+(i.size||0),0),trash=state.items.filter(i=>i.deletedAt).length;els.stats.innerHTML=`<div class="stat-card"><strong>${files.length}</strong><small>Files</small></div><div class="stat-card"><strong>${folders.length}</strong><small>Folders</small></div><div class="stat-card"><strong>${formatBytes(total)}</strong><small>Stored locally</small></div><div class="stat-card"><strong>${trash}</strong><small>In trash</small></div>`}
    function renderCard(i){const selected=state.selected.has(i.id)?'selected':'',deleted=i.deletedAt?`<span>Deleted ${formatDate(i.deletedAt)}</span>`:`<span>${formatBytes(i.size)}</span><span>${formatDate(i.updatedAt)}</span>`,fav=i.favorite?'★':'☆',tags=(i.tags||[]).slice(0,2).map(t=>`#${escapeHtml(t)}`).join(' '),actions=i.deletedAt?`<button data-action="restore" data-id="${escapeHtml(i.id)}">Restore</button><button class="danger" data-action="destroy" data-id="${escapeHtml(i.id)}">Delete forever</button>`:`<button data-action="open" data-id="${escapeHtml(i.id)}">Open</button><button data-action="favorite" data-id="${escapeHtml(i.id)}">${fav}</button><button data-action="more" data-id="${escapeHtml(i.id)}">More</button>`;return `<article class="file-card ${selected}" tabindex="0" data-id="${escapeHtml(i.id)}" title="${escapeHtml(i.name)}"><input class="file-check" type="checkbox" data-id="${escapeHtml(i.id)}" ${selected?'checked':''} aria-label="Select ${escapeHtml(i.name)}" /><div class="file-icon" aria-hidden="true">${iconFor(i)}</div><div class="file-info"><div class="file-name">${escapeHtml(i.name)}</div><div class="file-meta">${deleted}${tags?`<span>${tags}</span>`:''}</div></div><div class="card-actions">${actions}</div></article>`}
    function renderFiles(){const items=getVisibleItems();els.files.className=`files ${state.view}`;if(!items.length){const m=state.search?'No matching files found.':state.special==='trash'?'Trash is empty.':'Drop files here or use Upload to start.';els.files.innerHTML=`<div class="empty"><div><h3>${escapeHtml(m)}</h3><p>Create folders, upload files, and manage everything locally in your browser.</p></div></div>`;return}els.files.innerHTML=items.map(renderCard).join('');$$('.file-card',els.files).forEach(c=>{const id=c.dataset.id;c.addEventListener('dblclick',()=>openItem(id));c.addEventListener('keydown',e=>{if(e.key==='Enter')openItem(id);if(e.key===' '){e.preventDefault();toggleSelection(id)}})});$$('input[type="checkbox"]',els.files).forEach(input=>input.addEventListener('change',e=>{e.stopPropagation();toggleSelection(input.dataset.id,input.checked)}));$$('[data-action]',els.files).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();handleCardAction(b.dataset.action,b.dataset.id)}))}
    function renderBulkbar(){const c=state.selected.size;els.bulkbar.classList.toggle('visible',c>0);els.bulkText.textContent=`${c} selected`}
    function renderLocationButtons(){$('#homeBtn').classList.toggle('active',state.special==='home'&&state.currentFolderId===ROOT_ID);$('#favoriteBtn').classList.toggle('active',state.special==='favorites');$('#trashBtn').classList.toggle('active',state.special==='trash')}
    function renderStatus(){const visible=getVisibleItems().length,loc=state.special==='trash'?'trash':state.special==='favorites'?'favorites':'current folder';els.statusText.textContent=`${visible} item${visible===1?'':'s'} in ${loc}`;els.sortSelect.value=state.sort;els.viewToggleBtn.textContent=state.view==='grid'?'▦ Grid':'☰ List';document.documentElement.dataset.theme=state.theme;els.themeBtn.textContent=state.theme==='dark'?'☀️':'🌙'}
    function render(){renderBreadcrumb();renderFolderTree();renderFilters();renderStats();renderFiles();renderBulkbar();renderLocationButtons();renderStatus()}
    function toggleSelection(id,force){if(force===true)state.selected.add(id);else if(force===false)state.selected.delete(id);else if(state.selected.has(id))state.selected.delete(id);else state.selected.add(id);renderFiles();renderBulkbar()}
    const selectedItems=()=>Array.from(state.selected).map(findItem).filter(Boolean);
    async function openItem(id){const item=findItem(id);if(!item)return;if(item.type==='folder'){setLocation('home',item.id);return}await previewFile(item)}
    async function handleCardAction(action,id){const item=findItem(id);if(!item)return;if(action==='open')return openItem(id);if(action==='favorite')return updateItems([item],p=>({...p,favorite:!p.favorite,updatedAt:new Date().toISOString()}));if(action==='restore')return restoreItems([item]);if(action==='destroy')return destroyItems([item]);if(action==='more')return showItemMenu(item)}
    async function previewFile(item){const url=item.blob?URL.createObjectURL(item.blob):'';let body='',footer=`<button id="downloadPreviewBtn">Download</button><button id="renamePreviewBtn">Rename</button><button id="closePreviewBtn" class="primary">Close</button>`;if(item.mime?.startsWith('image/'))body=`<img class="preview-image" src="${url}" alt="${escapeHtml(item.name)}" />`;else if(item.mime?.startsWith('video/'))body=`<video class="preview-video" controls src="${url}"></video>`;else if(item.mime?.startsWith('audio/'))body=`<audio controls src="${url}" style="width:100%"></audio>`;else if(item.mime?.includes('pdf'))body=`<iframe class="preview-frame" src="${url}" title="${escapeHtml(item.name)}"></iframe>`;else if(isTextLike(item)){const text=await item.blob.text().catch(()=>item.textIndex||'');body=`<textarea class="text-editor" id="textEditor" spellcheck="false">${escapeHtml(text)}</textarea>`;footer=`<button id="saveTextBtn" class="primary">Save text</button>`+footer}else body=`<div class="empty"><div><h3>No browser preview available</h3><p>${escapeHtml(item.name)} · ${formatBytes(item.size)}</p></div></div>`;showModal(item.name,body,footer,()=>{$('#downloadPreviewBtn')?.addEventListener('click',()=>downloadItem(item));$('#renamePreviewBtn')?.addEventListener('click',()=>renameItems([item]));$('#closePreviewBtn')?.addEventListener('click',closeModal);$('#saveTextBtn')?.addEventListener('click',async()=>{const text=$('#textEditor').value,blob=new Blob([text],{type:item.mime||'text/plain'});await updateItems([item],cur=>({...cur,blob,size:blob.size,textIndex:text.slice(0,MAX_TEXT_PREVIEW_BYTES),updatedAt:new Date().toISOString()}));toast('Text file saved.','success')})},()=>url&&URL.revokeObjectURL(url))}
    function showItemMenu(item){const body=`<div class="form-grid"><p><strong>${escapeHtml(item.name)}</strong></p><p class="file-meta">${item.type} · ${formatBytes(item.size)} · Updated ${formatDate(item.updatedAt)}</p><label>Tags, comma separated<input id="tagsInput" value="${escapeHtml((item.tags||[]).join(', '))}" /></label></div>`,footer=`<button id="saveTagsBtn" class="primary">Save tags</button><button id="renameItemBtn">Rename</button><button id="duplicateItemBtn">Duplicate</button><button id="downloadItemBtn">Download</button><button class="danger" id="trashItemBtn">Move to trash</button>`;showModal('File actions',body,footer,()=>{$('#saveTagsBtn').addEventListener('click',async()=>{const tags=$('#tagsInput').value.split(',').map(v=>v.trim()).filter(Boolean).slice(0,12);await updateItems([item],cur=>({...cur,tags,updatedAt:new Date().toISOString()}));closeModal();toast('Tags updated.','success')});$('#renameItemBtn').addEventListener('click',()=>renameItems([item]));$('#duplicateItemBtn').addEventListener('click',()=>duplicateItems([item]));$('#downloadItemBtn').addEventListener('click',()=>downloadItem(item));$('#trashItemBtn').addEventListener('click',()=>trashItems([item]))})}
    function showModal(title,body,footer='',afterRender=null,afterClose=null){els.modalTitle.textContent=title;els.modalBody.innerHTML=body;els.modalFooter.innerHTML=footer;els.modalBackdrop.classList.add('visible');els.modalBackdrop._afterClose=afterClose;afterRender?.()}
    function closeModal(){const afterClose=els.modalBackdrop._afterClose;els.modalBackdrop.classList.remove('visible');els.modalBody.innerHTML='';els.modalFooter.innerHTML='';els.modalBackdrop._afterClose=null;afterClose?.()}
    async function updateItems(items,updater){for(const item of items)await saveItem(updater({...item}));await refresh()}
    async function renameItems(items){if(items.length!==1)return toast('Select exactly one item to rename.','error');const item=items[0],name=prompt('New name:',item.name);if(!name)return;await updateItems([item],cur=>({...cur,name:uniqueName(name,cur.parentId,cur.id),updatedAt:new Date().toISOString()}));closeModal();toast('Renamed item.','success')}
    async function duplicateItems(items){for(const item of items){const now=new Date().toISOString(),copy={...item,id:uid(item.type),name:uniqueName(`${item.name} copy`,item.parentId),createdAt:now,updatedAt:now,favorite:false};await saveItem(copy);if(item.type==='folder')await duplicateDescendants(item.id,copy.id)}closeModal();await refresh();toast('Duplicated selection.','success')}
    async function duplicateDescendants(src,target){for(const child of childrenOf(src)){const now=new Date().toISOString(),copy={...child,id:uid(child.type),parentId:target,createdAt:now,updatedAt:now,favorite:false};await saveItem(copy);if(child.type==='folder')await duplicateDescendants(child.id,copy.id)}}
    async function trashItems(items){const ids=new Set(items.map(i=>i.id));items.filter(i=>i.type==='folder').forEach(f=>descendantsOf(f.id).forEach(c=>ids.add(c.id)));const now=new Date().toISOString();for(const id of ids){const item=findItem(id);if(item)await saveItem({...item,deletedAt:now,updatedAt:now})}state.selected.clear();closeModal();await refresh();toast('Moved to trash.','success')}
    async function restoreItems(items){for(const item of items){const parentOk=isFolderAvailable(item.parentId);await saveItem({...item,parentId:parentOk?item.parentId:ROOT_ID,deletedAt:null,updatedAt:new Date().toISOString()})}state.selected.clear();await refresh();toast('Restored item(s).','success')}
    async function destroyItems(items){if(!confirm(`Permanently delete ${items.length} item${items.length===1?'':'s'}? This cannot be undone.`))return;const ids=new Set(items.map(i=>i.id));items.filter(i=>i.type==='folder').forEach(f=>descendantsOf(f.id,true).forEach(c=>ids.add(c.id)));for(const id of ids)await deleteItemHard(id);state.selected.clear();await refresh();toast('Deleted permanently.','success')}
    async function moveItems(items){const folders=activeItems().filter(i=>i.type==='folder'),options=[`<option value="${ROOT_ID}">Home</option>`].concat(folders.map(f=>`<option value="${escapeHtml(f.id)}">${escapeHtml(folderPath(f.id).map(p=>p.name).join(' / '))}</option>`)).join('');showModal('Move selection',`<label class="form-grid">Destination<select id="destinationSelect">${options}</select></label>`,'<button id="moveConfirmBtn" class="primary">Move here</button>',()=>{$('#moveConfirmBtn').addEventListener('click',async()=>{const dest=$('#destinationSelect').value,movingFolderIds=new Set(items.filter(i=>i.type==='folder').map(i=>i.id));if(movingFolderIds.has(dest)||items.some(i=>i.type==='folder'&&descendantsOf(i.id).some(c=>c.id===dest))){toast('Cannot move a folder inside itself.','error');return}for(const item of items)await saveItem({...item,parentId:dest,name:uniqueName(item.name,dest,item.id),updatedAt:new Date().toISOString()});state.selected.clear();closeModal();await refresh();toast('Moved selection.','success')})})}
    function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
    function downloadItem(item){if(item.type==='folder')return exportBackup([item,...descendantsOf(item.id,false)],`${item.name}-backup.json`);downloadBlob(item.blob,item.name)}
    async function downloadSelected(items){if(!items.length)return;if(items.length===1)return downloadItem(items[0]);await exportBackup(items.flatMap(i=>i.type==='folder'?[i,...descendantsOf(i.id,false)]:[i]),'filemanager-selection-backup.json')}
    async function blobToBase64(blob){const buffer=await blob.arrayBuffer(),bytes=new Uint8Array(buffer);let binary='';for(let i=0;i<bytes.byteLength;i++)binary+=String.fromCharCode(bytes[i]);return btoa(binary)}
    function base64ToBlob(base64,mime){const binary=atob(base64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type:mime||'application/octet-stream'})}
    async function exportBackup(items=activeItems(),filename='filemanager-backup.json'){const unique=Array.from(new Map(items.map(i=>[i.id,i])).values()),payload={app:'File Manager Pro',version:1,exportedAt:new Date().toISOString(),items:[]};for(const item of unique){const copy={...item,blob:undefined};if(item.type==='file'&&item.blob)copy.data=await blobToBase64(item.blob);payload.items.push(copy)}downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),filename);toast('Backup exported.','success')}
    async function importBackup(file){const payload=JSON.parse(await file.text());if(!payload||!Array.isArray(payload.items))throw new Error('Invalid backup file.');const idMap=new Map([[ROOT_ID,ROOT_ID]]);for(const item of payload.items)idMap.set(item.id,uid(item.type||'item'));for(const item of payload.items){const copy={...item,id:idMap.get(item.id),parentId:idMap.get(item.parentId)||ROOT_ID,deletedAt:null,favorite:Boolean(item.favorite),tags:item.tags||[]};if(copy.type==='file'&&copy.data)copy.blob=base64ToBlob(copy.data,copy.mime);delete copy.data;copy.name=uniqueName(copy.name,copy.parentId);copy.createdAt=copy.createdAt||new Date().toISOString();copy.updatedAt=new Date().toISOString();await saveItem(copy)}await refresh();toast(`Imported ${payload.items.length} item${payload.items.length===1?'':'s'}.`,'success')}
    async function tagItems(items){const current=items.length===1?(items[0].tags||[]).join(', '):'';showModal('Edit tags',`<label class="form-grid">Tags, comma separated<input id="bulkTagsInput" value="${escapeHtml(current)}" placeholder="school, project, archive" /></label>`,'<button id="saveBulkTagsBtn" class="primary">Apply tags</button>',()=>{$('#saveBulkTagsBtn').addEventListener('click',async()=>{const tags=$('#bulkTagsInput').value.split(',').map(v=>v.trim()).filter(Boolean).slice(0,12);await updateItems(items,item=>({...item,tags,updatedAt:new Date().toISOString()}));closeModal();toast('Tags applied.','success')})})}
    function bindEvents(){$('#newFolderBtn').addEventListener('click',async()=>{const name=prompt('Folder name:','New Folder');if(name)await createFolder(name)});$('#newFileBtn').addEventListener('click',async()=>{const name=prompt('Text file name:','Notes.txt');if(name){const item=await createTextFile(name);await previewFile(item)}});$('#uploadBtn').addEventListener('click',()=>els.fileInput.click());$('#uploadFolderBtn').addEventListener('click',()=>els.folderInput.click());$('#backupBtn').addEventListener('click',()=>exportBackup());$('#restoreBtn').addEventListener('click',()=>els.restoreInput.click());$('#homeBtn').addEventListener('click',()=>setLocation('home',ROOT_ID));$('#favoriteBtn').addEventListener('click',()=>setLocation('favorites'));$('#trashBtn').addEventListener('click',()=>setLocation('trash'));els.fileInput.addEventListener('change',e=>uploadFiles(e.target.files,false).finally(()=>{e.target.value=''}));els.folderInput.addEventListener('change',e=>uploadFiles(e.target.files,true).finally(()=>{e.target.value=''}));els.restoreInput.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{await importBackup(file)}catch(error){toast(error.message||'Could not import backup.','error')}finally{e.target.value=''}});els.searchInput.addEventListener('input',e=>{state.search=e.target.value;state.selected.clear();render()});els.sortSelect.addEventListener('change',e=>{state.sort=e.target.value;localStorage.setItem('fm:sort',state.sort);render()});els.viewToggleBtn.addEventListener('click',()=>{state.view=state.view==='grid'?'list':'grid';localStorage.setItem('fm:view',state.view);render()});els.themeBtn.addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('fm:theme',state.theme);render()});$('#selectAllBtn').addEventListener('click',()=>{getVisibleItems().forEach(i=>state.selected.add(i.id));render()});$('#clearSelectionBtn').addEventListener('click',()=>{state.selected.clear();render()});$('#moveBtn').addEventListener('click',()=>moveItems(selectedItems().filter(i=>!i.deletedAt)));$('#downloadBtn').addEventListener('click',()=>downloadSelected(selectedItems()));$('#tagBtn').addEventListener('click',()=>tagItems(selectedItems().filter(i=>!i.deletedAt)));$('#deleteBtn').addEventListener('click',()=>{const items=selectedItems();if(state.special==='trash')destroyItems(items);else trashItems(items)});$('#modalCloseBtn').addEventListener('click',closeModal);els.modalBackdrop.addEventListener('click',e=>{if(e.target===els.modalBackdrop)closeModal()});els.dropzone.addEventListener('dragover',e=>{e.preventDefault();els.dropzone.classList.add('dragover')});els.dropzone.addEventListener('dragleave',()=>els.dropzone.classList.remove('dragover'));els.dropzone.addEventListener('drop',e=>{e.preventDefault();els.dropzone.classList.remove('dragover');uploadFiles(e.dataTransfer.files,false)});document.addEventListener('keydown',e=>{if(e.target.matches('input, textarea, select'))return;if(e.key==='/'){e.preventDefault();els.searchInput.focus()}if(e.key.toLowerCase()==='n')$('#newFolderBtn').click();if(e.key.toLowerCase()==='u')$('#uploadBtn').click();if(e.key==='Delete'&&state.selected.size)$('#deleteBtn').click();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();$('#selectAllBtn').click()}if(e.key==='Escape'){state.selected.clear();closeModal();render()}})}
    async function seedWelcomeFile(){if(state.items.length)return;await createTextFile('Welcome.md',`# Welcome to File Manager Pro\n\nThis is a local-first file manager that stores your files in the browser using IndexedDB.\n\nFeatures:\n- Upload files or entire folders\n- Preview images, PDFs, audio, video, and text\n- Edit text files\n- Search names, tags, types, and indexed text snippets\n- Rename, duplicate, move, favorite, tag, delete, restore, and permanently delete\n- Export/import full JSON backups\n- Works offline after first load\n\nTip: press / to search, N for a new folder, U to upload, and Delete to trash selected items.\n`)}
    async function init(){document.documentElement.dataset.theme=state.theme;els.sortSelect.value=state.sort;bindEvents();try{state.db=await openDb();state.items=await getAllItems();await seedWelcomeFile();await refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(error){console.error(error);toast('Could not open local database. Check browser storage permissions.','error')}}
    init();
  })();
  </script>
